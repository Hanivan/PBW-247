<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Bahan Ajar - SITTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/japanese-aesthetic.css">
  <link rel="stylesheet" href="css/stok-detail-enhanced.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <span class="sidebar-brand-icon">S</span>
          <span>SITTA</span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-item">
          <span>(^^)</span>
          <span>Dashboard</span>
        </a>
        <a href="tracking.html" class="nav-item">
          <span>(>_<)</span>
          <span>Tracking Pengiriman</span>
        </a>
        <a href="stok.html" class="nav-item">
          <span>(_|_)</span>
          <span>Stok Bahan Ajar</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-secondary btn-block" data-action="toggle-theme">(-_-) Dark Mode</button>
        <button class="btn btn-danger btn-block mt-sm" data-action="logout">Logout</button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="header">
        <button class="sidebar-toggle" aria-label="Toggle sidebar">≡</button>
        <div class="header-content">
          <h1 class="page-title">
            <span class="stok-detail-page-title">Detail Bahan Ajar</span>
            <span class="stok-detail-page-title-sub">教材詳細</span>
          </h1>
        </div>
      </header>

      <div class="content">
        <div id="stockDetailContent">
          <!-- Detail will be rendered here -->
        </div>
      </div>
    </main>
  </div>

  <!-- Logout Confirmation Modal -->
  <div class="modal-backdrop" id="logoutModal">
    <div class="modal" role="dialog" aria-labelledby="logoutTitle">
      <header class="modal-header">
        <h2 class="modal-title" id="logoutTitle">Konfirmasi Logout</h2>
        <button class="modal-close" aria-label="Tutup modal">&times;</button>
      </header>
      <div class="modal-body">
        <p class="text-secondary mb-md">
          Apakah Anda yakin ingin keluar dari aplikasi?
        </p>
      </div>
      <footer class="modal-footer">
        <button class="btn btn-secondary modal-close">Batal</button>
        <button class="btn btn-danger" data-action="confirm-logout">Ya, Keluar</button>
      </footer>
    </div>
  </div>

  <!-- Load Scripts -->
  
  
  
  
  <script type="module" src="js/pages.js"></script>
</body>
</html>
